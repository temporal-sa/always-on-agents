[project]
name = "always-on-agents"
version = "0.1.0"
description = "Temporal reference implementation for 'The durable execution behind always-on agents': a briefing assistant that schedules, runs, remembers, and cleans up after itself."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "temporalio>=1.36.1",
    "uvicorn>=0.30",
]

[project.scripts]
agent = "always_on_agents.cli:main"
agent-worker = "always_on_agents.worker:main"
agent-web = "always_on_agents.web.server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
